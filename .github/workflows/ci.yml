name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in sync.mjs skills/*/scripts/*.mjs adapters/claude/hooks/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node --test test/*.test.mjs
